version: "1.0"
partition_key: user_id
topics:
  user-events:
    partitions: 4
    event_types:
      [LOGIN, SEARCH, PAGE_VIEW, VIEW_PRODUCT, ADD_TO_CART, REMOVE_FROM_CART]
  purchase-events:
    partitions: 2
    event_types: [PURCHASE, PAYMENT_FAILED]
  iot-events:
    partitions: 2
    event_types: [GPS_UPDATE, IOT_READING, MOTION_DETECTED]
  system-events:
    partitions: 1
    event_types: [SOCIAL_POST]
    note: Los eventos de control requieren un contrato adicional.
  dead-letter:
    partitions: 1
    event_types: []
    note: Recibe mensajes que no cumplen el esquema.

output_topics:
  metrics.throughput:
    partitions: 1
    description: Eventos por segundo agregados por ventana
  metrics.active-users:
    partitions: 1
    description: Conteo de usuarios activos únicos por ventana
  metrics.events-by-type:
    partitions: 1
    description: Distribución de eventos por tipo
  metrics.top-products-viewed:
    partitions: 1
    description: Ranking de productos más vistos
  metrics.top-products-purchased:
    partitions: 1
    description: Ranking de productos más comprados
  metrics.purchases-by-region:
    partitions: 1
    description: Compras y montos acumulados por región
  metrics.conversion:
    partitions: 1
    description: Funnel de conversión (views -> cart -> purchase)
  metrics.trends:
    partitions: 1
    description: Series de tiempo para tendencias
  audiences.classifications:
    partitions: 2
    description: Clasificación de usuarios en las 7 audiencias
  alerts.anomalies:
    partitions: 1
    description: Alertas y detección de anomalías

