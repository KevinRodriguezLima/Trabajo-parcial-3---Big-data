# Override del stack base. Siempre se usa junto a compose.yaml:
#   docker compose -f infra/compose.yaml -f infra/compose.flink.yaml up -d
# La red `audiencias` la crea compose.yaml con nombre fijo, así que otro
# proyecto (el dashboard de D) puede declararla como external y unirse.

services:
  flink-jobmanager:
    image: ${FLINK_IMAGE}
    container_name: audiencias-flink-jobmanager
    command: jobmanager
    environment:
      # Se declaran las claves de checkpoint de Flink 1.x y 2.x a la vez:
      # cambiaron de nombre en 2.0 y Flink ignora las que no reconoce, así que
      # el override sigue sirviendo si C fija otra versión en FLINK_IMAGE.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: ${FLINK_PARALLELISM}
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 10s
    ports:
      - "${FLINK_UI_PORT}:8081"
    volumes:
      - ../flink-jobs:/opt/flink/jobs:ro
      - ./checkpoints:/opt/flink/checkpoints
      - ./savepoints:/opt/flink/savepoints
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiencias

  flink-taskmanager:
    image: ${FLINK_IMAGE}
    container_name: audiencias-flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS}
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
    volumes:
      - ../flink-jobs:/opt/flink/jobs:ro
      - ./checkpoints:/opt/flink/checkpoints
      - ./savepoints:/opt/flink/savepoints
    depends_on:
      - flink-jobmanager
    restart: unless-stopped
    networks:
      - audiencias
